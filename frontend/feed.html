<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활동 인증 서비스 - 게시물</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="feed.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div>
      <p class="eyebrow">Together Log</p>
      <h1>활동 인증 서비스</h1>
      <p id="member-summary">오늘의 활동을 확인하고 공유하세요.</p>
    </div>
    <nav class="top-nav" aria-label="주요 메뉴">
      <a href="feed.html">게시물</a>
      <a class="nav-action" href="new-post.html">게시물 작성</a>
      <button id="logout-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="feed-toolbar" aria-labelledby="feed-title">
      <div>
        <h2 id="feed-title">전체 게시물</h2>
        <p class="section-copy">다른 사람이 올린 활동 인증을 최신순으로 보여줍니다.</p>
      </div>

      <div class="summary-grid" aria-label="게시물 요약">
        <div>
          <span id="post-count">0</span>
          <p>게시물</p>
        </div>
        <div>
          <span id="member-count">0</span>
          <p>참여자</p>
        </div>
      </div>
    </section>

    <section aria-label="게시물 목록">
      <div id="feed-list" class="feed-list"></div>

      <div id="empty-feed" class="empty-state" hidden>
        <h3>아직 게시물이 없습니다.</h3>
        <p>첫 활동 기록을 올려보세요.</p>
        <a class="primary-button" href="new-post.html">게시물 작성</a>
      </div>
    </section>
  </main>
</body>
</html>
