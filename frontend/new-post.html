<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활동 인증 서비스 - 게시물 작성</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="new-post.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div>
      <p class="eyebrow">Together Log</p>
      <h1>활동 인증 서비스</h1>
      <p id="member-summary">오늘 한 일을 간단하게 남겨보세요.</p>
    </div>
    <nav class="top-nav" aria-label="주요 메뉴">
      <a href="feed.html">게시물</a>
      <button id="logout-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="page-shell compose-shell">
    <section class="panel form-panel compose-panel" aria-labelledby="post-title">
      <div class="form-panel-head">
        <h2 id="post-title">게시물 작성</h2>
        <p class="section-copy">이미지는 선택사항입니다. 글만 올려도 됩니다.</p>
      </div>

      <form id="post-form" action="/posts" method="post" enctype="multipart/form-data" novalidate>
        <div class="field">
          <label for="activity-type">활동 종류</label>
          <select id="activity-type" name="activityType" required></select>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="description">간단한 설명</label>
            <span id="description-count" class="char-count">0/500</span>
          </div>
          <textarea
            id="description"
            name="description"
            rows="6"
            maxlength="500"
            required
          ></textarea>
        </div>

        <div class="field">
          <label for="image">이미지 올리기</label>
          <div class="upload-field">
            <label class="upload-dropzone" for="image" id="upload-dropzone">
              <span class="upload-icon" aria-hidden="true">+</span>
              <span class="upload-text">클릭해서 이미지 선택</span>
            </label>
            <input
              type="file"
              id="image"
              name="image"
              accept="image/*"
              hidden
            >
            <div id="image-preview" class="image-preview" hidden>
              <img id="image-preview-img" alt="선택한 이미지 미리보기">
              <button type="button" id="image-remove" class="image-remove" aria-label="이미지 제거">✕</button>
            </div>
          </div>
          <p class="helper-text">선택한 이미지는 게시물에 함께 표시됩니다.</p>
        </div>

        <p id="post-message" class="form-message" aria-live="polite"></p>

        <div class="form-actions">
          <a class="secondary-button" href="feed.html">취소</a>
          <button class="primary-button" type="submit">게시물 올리기</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
